<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>瞬間英作文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#18202B; --muted:#5F6B7A; --line:#CCD4DD;
  --en:#1F4FD8; --en-soft:#E3EAFB; --ok:#1E7A52; --ok-soft:#DDF0E6; --again:#A2461F; --again-soft:#F6E4DA;
  --ja-font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  --en-font:"Figtree","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131922; --surface:#1C2430; --ink:#E7ECF2; --muted:#98A4B3; --line:#2E3947;
    --en:#8CA9FF; --en-soft:#1F2B47; --ok:#6FCF9E; --ok-soft:#183328; --again:#F09A73; --again-soft:#3A2419;
  }
}
:root[data-theme="dark"]{
  --bg:#131922; --surface:#1C2430; --ink:#E7ECF2; --muted:#98A4B3; --line:#2E3947;
  --en:#8CA9FF; --en-soft:#1F2B47; --ok:#6FCF9E; --ok-soft:#183328; --again:#F09A73; --again-soft:#3A2419;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ja-font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--en);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px;min-height:100%}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.02em}
.toggles{display:flex;gap:4px}
.tg{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px;font-size:.72rem;color:var(--muted)}
.tg[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.tg .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tg[aria-pressed="true"] .dot{background:var(--ok)}
.tg.en[aria-pressed="true"] .dot{background:var(--en)}
.tg.auto[aria-pressed="true"] .dot{background:var(--again)}
.toggles{flex-wrap:wrap}
.en{position:relative}
.cd{position:absolute;left:0;right:0;top:-1px;height:3px;display:none}
.cd i{display:block;height:100%;width:0;background:var(--en)}
.cd.run{display:block}
.cd.run i{animation:cd 5s linear forwards}
@keyframes cd{from{width:0}to{width:100%}}

.sets{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.set{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:6px 0 8px;font-size:.92rem;color:var(--muted)}
.set[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.set small{font-family:var(--en-font);font-size:.78rem;margin-left:4px;color:var(--muted);font-weight:400}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.bar{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-family:var(--en-font)}

/* The card: styled like a monitor with a subtitle strip */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-height:340px}
.ja{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 28px 26px;gap:14px}
.cat{font-size:.78rem;color:var(--muted)}
.ja-text{margin:0;font-size:clamp(1.55rem,5.2vw,2.25rem);font-weight:700;line-height:1.45;letter-spacing:.01em}
.en{border-top:1px solid var(--line);background:var(--en-soft);padding:22px 28px 24px;min-height:118px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px}
.reply{border-left:2px solid var(--en);padding-left:12px;display:flex;flex-direction:column;gap:2px;width:100%}
.reply-head{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.reply-en{margin:0;font-family:var(--en-font);font-size:clamp(1.02rem,3.4vw,1.2rem);font-weight:500;line-height:1.4;color:var(--ink)}
.reply-ja{margin:0;font-size:.85rem;color:var(--muted)}
.reply .rp{padding:2px 8px;font-size:.72rem}
.en.reveal .reply{animation:rise .22s ease-out .15s both}
.gram{width:100%;display:flex;flex-direction:column;gap:6px;font-size:.86rem;line-height:1.6}
.gram-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gram-badge{font-family:var(--en-font);font-weight:600;font-size:.78rem;border:1px solid var(--en);color:var(--en);border-radius:6px;padding:1px 8px}
.gram-label{font-size:.75rem;color:var(--muted)}
.gram-struct{font-family:var(--en-font);font-size:.95rem;color:var(--ink);overflow-wrap:anywhere}
.gram-struct .sep{color:var(--line);margin:0 4px}
.gram-struct sub{font-size:.62rem;font-weight:700;vertical-align:baseline;position:relative;top:.35em;margin-left:1px;padding:0 3px;border-radius:3px;color:var(--surface)}
.t-S{background:#3B6FD9}.t-V{background:#C2513A}.t-O{background:#2F8A5B}.t-C{background:#8A5BC2}.t-M{background:#7A8594}
.gram-text{margin:0;color:var(--ink)}
.idioms{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.idioms li{color:var(--ink)}
.idioms b{font-family:var(--en-font);font-weight:600;color:var(--en);margin-right:6px}
.en.reveal .gram{animation:rise .22s ease-out .1s both}

.en-text{margin:0;font-family:var(--en-font);font-size:clamp(1.3rem,4.4vw,1.8rem);font-weight:600;line-height:1.35;color:var(--en)}
.en-hidden{font-size:.9rem;color:var(--muted)}
.en.reveal .en-text{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.replay{display:flex;gap:8px;margin-top:2px}
.rp{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.rp svg{width:14px;height:14px}
.rp:disabled{opacity:.4;cursor:default}

.actions{display:grid;grid-template-columns:auto 1fr auto;gap:10px}
.btn{border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.nav{padding:14px 16px;font-weight:500}
.grade{display:none;grid-template-columns:1fr 1fr;gap:10px}
.grade.on{display:grid}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.again{background:var(--again-soft);border-color:transparent;color:var(--again)}

.sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.sub .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link{background:none;border:none;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.82rem}
.link[aria-pressed="true"]{color:var(--ink);font-weight:700}

details.settings{border-top:1px solid var(--line);padding-top:12px;font-size:.88rem}
details.settings summary{cursor:pointer;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;margin-top:12px}
.set-grid select{width:100%;max-width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.set-grid input[type=range]{width:100%}
.note{color:var(--muted);font-size:.8rem;margin:10px 0 0;line-height:1.6}
.kbd{font-family:var(--en-font);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px}

.empty{padding:40px 28px;text-align:center;color:var(--muted)}
@media (max-width:480px){
  .ja{padding:26px 20px 20px}.en{padding:18px 20px 20px}
  .actions{grid-template-columns:auto 1fr auto;gap:8px}
  .btn.nav{padding:14px 12px}
}
@media (prefers-reduced-motion:reduce){.en.reveal .en-text{animation:none}.track i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>瞬間英作文</h1>
    <div class="toggles" role="group" aria-label="音声">
      <button class="tg" id="tgJa" aria-pressed="true"><span class="dot"></span>日本語の音声</button>
      <button class="tg en" id="tgEn" aria-pressed="true"><span class="dot"></span>英語の音声</button>
      <button class="tg auto" id="tgAuto" aria-pressed="false"><span class="dot"></span>自動で進む</button>
    </div>
  </header>

  <div class="sets" id="sets" role="group" aria-label="教材"></div>
  <div class="filters" id="filters" role="group" aria-label="カテゴリー"></div>

  <div class="bar">
    <div class="track"><i id="prog"></i></div>
    <span class="count" id="count">0 / 0</span>
  </div>

  <main class="card" id="card" aria-live="polite">
    <div class="ja">
      <div class="cat" id="cat"></div>
      <p class="ja-text" id="jaText"></p>
      <div class="replay">
        <button class="rp" id="rpJa" aria-label="日本語をもう一度再生"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 5.5h2.5L9 2.5v11l-3.5-3H3z"/><path d="M11 5.2a3.5 3.5 0 0 1 0 5.6" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round"/></svg>日本語</button>
        <button class="rp" id="rpEn" aria-label="英語をもう一度再生" disabled><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 5.5h2.5L9 2.5v11l-3.5-3H3z"/><path d="M11 5.2a3.5 3.5 0 0 1 0 5.6" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round"/></svg>English</button>
      </div>
    </div>
    <div class="en" id="enBox"><div class="cd" id="cd"><i></i></div><span class="en-hidden" id="enHidden">英語で言ってから、表示してください</span><p class="en-text" id="enText" hidden></p><div class="gram" id="gram" hidden></div><div class="reply" id="reply" hidden><div class="reply-head">返答の例<button class="rp" id="rpReply" aria-label="返答を再生"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 5.5h2.5L9 2.5v11l-3.5-3H3z"/><path d="M11 5.2a3.5 3.5 0 0 1 0 5.6" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round"/></svg>再生</button></div><p class="reply-en" id="replyEn"></p><p class="reply-ja" id="replyJa"></p></div></div>
  </main>

  <div class="actions" id="actions">
    <button class="btn nav" id="prev" aria-label="前の文">前へ</button>
    <button class="btn primary" id="reveal">英語を表示</button>
    <button class="btn nav" id="next" aria-label="次の文">次へ</button>
  </div>
  <div class="grade" id="grade">
    <button class="btn again" id="again">言えなかった</button>
    <button class="btn ok" id="ok">言えた</button>
  </div>

  <div class="sub">
    <div class="grp">
      <button class="link" id="shuffle" aria-pressed="false">シャッフル</button>
      <button class="link" id="weak" aria-pressed="false">言えなかった文だけ</button>
      <button class="link" id="tgReply" aria-pressed="true">返答の例</button>
      <button class="link" id="tgGram" aria-pressed="true">文法</button>
    </div>
    <div class="grp"><span id="stat"></span><button class="link" id="reset">記録をリセット</button></div>
  </div>

  <details class="settings">
    <summary>音声の設定</summary>
    <div class="set-grid">
      <label for="vJa">日本語の声</label><select id="vJa"></select>
      <label for="vEn">英語の声</label><select id="vEn"></select>
      <label for="vReply">返答の声</label><select id="vReply"></select>
      <label for="rateJa">日本語の速さ</label><input type="range" id="rateJa" min="0.8" max="2" step="0.05" value="1.3">
      <label for="rate">英語の速さ</label><input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="1">
    </div>
    <p class="note">音声はお使いの端末・ブラウザに入っている読み上げ音声を使います。自動で最も自然な声を選びますが、変えたい場合は上から選んでください。Mac/iPhone は「Siri」「プレミアム」「拡張」の声、Chrome/Edge は「Google」「Natural」「Online」の声が自然です。<br>キーボード: <span class="kbd">Space</span> 英語を表示・次へ　<span class="kbd">←</span><span class="kbd">→</span> 前後　<span class="kbd">J</span><span class="kbd">E</span> 再生</p>
  </details>
</div>

<script>
const GRAMMAR = {"0": ["SV", "What time(M) / did you(S) / get up(V) / today(M)", "過去形の疑問文。What time で時刻をたずねる。", [["get up", "起きる、起床する"]]], "1": ["SV", "I(S) / didn't sleep(V) / very well(M) / last night(M)", "過去形の否定文。not very well で「あまりよく…ない」。", []], "2": ["SVO", "I(S) / wanted(V) / to sleep a little longer(O)", "want to do（不定詞の名詞的用法）。to sleep 以下が目的語。", []], "3": ["SVO", "Do you(S) / have(V) / any plans(O) / today(M)", "一般動詞の疑問文。疑問文では some ではなく any を使う。", []], "4": ["SVO", "I(S) / don't really have(V) / any plans(O) / today(M)", "否定文の not ... any で「何も…ない」。really を入れると否定が柔らかくなる。", [["not really", "あまり…ない、特に…ない"]]], "5": ["SV", "I(S) / 'm gonna run(V) / to the convenience store(M)", "be going to（gonna）で予定・意志を表す。", [["run to (場所)", "(近くの場所)にちょっと行ってくる"]]], "6": ["SVOC", "Do you(S) / want(V) / me(O) / to get you anything(C)", "want + 人 + to do「人に…してほしい」。to 以下の get you anything は SVOO の形。", [["get (人) (物)", "人に物を買ってくる、取ってくる"]]], "7": ["SVO", "Do you(S) / want(V) / some coffee(O)", "勧める場面の疑問文では any ではなく some を使うのが自然。", []], "8": ["SVC / SVO", "I(S) / 'm(V) / good(C). I(S) / just had(V) / some(O)", "I'm good は丁寧に断る口語表現。just + 過去形で「ついさっき…した」。", [["I'm good.", "大丈夫です、結構です（断るとき）"]]], "9": ["SVO", "Should I(S) / put(V) / this(O) / in the fridge(M)", "Should I ...? で「…した方がいい？」と相手の意見をたずねる。", []], "10": ["SVC + SVO", "I(S) / 'm(V) / hungry(C), but I(S) / don't know(V) / what to eat(O)", "疑問詞 + to 不定詞（what to eat）が名詞のかたまりとして目的語になる。", []], "11": ["SV", "Let's(V) / just eat(V) / at home(M) / today(M)", "Let's + 動詞の原形で「…しよう」。主語は省略されている（命令文の一種）。", []], "12": ["SVC", "This(S) / is(V) / better(C) / than I expected(M)", "比較級 + than ...。than のあとに節（I expected）が続く。", []], "13": ["SVC", "Isn't this(S) / a little too salty(C)", "否定疑問文で「…じゃない？」と同意を求める。too は「…すぎる」。", []], "14": ["SVC", "I(S) / 'm(V) / full(C) / already(M)", "be 動詞 + 形容詞。already は文末に置くと「もう」の意外さが出る。", []], "15": ["SVO", "I(S) / 'm gonna take(V) / a bath(O) / later(M)", "be going to（gonna）で予定を表す。", [["take a bath", "お風呂に入る"]]], "16": ["SVC", "Isn't the AC(S) / a little too cold(C)", "否定疑問文で「…じゃない？」と同意を求める。", []], "17": ["SVO", "Can you(S) / turn(V) / the TV(O) / down(M) / a little(M)", "Can you ...? で気軽な依頼。目的語が名詞なら turn the TV down / turn down the TV のどちらも可。", [["turn (物) down", "(音量・温度など)を下げる"]]], "18": ["SVO", "Where(M) / did I(S) / put(V) / this(O)", "過去形の疑問文。put は過去形も put。", []], "19": ["SV", "It(S) / was(V) / right here(M) / a minute ago(M)", "be 動詞 + 場所で「…にある」。right で場所を強調する。", [["a minute ago", "ついさっき"]]], "20": ["SV", "I(S) / 'm working(V) / from home(M) / today(M)", "現在進行形で「今日は…している」という一時的な状況を表す。", [["work from home", "在宅で働く、リモートワークする"]]], "21": ["SV", "I(S) / gotta go(V) / to the studio(M) / tomorrow(M)", "gotta = have got to（have to）の口語形で「…しなければならない」。", []], "22": ["SVC", "I(S) / 'm(V) / pretty busy(C) / this week(M)", "pretty は口語で「かなり」。", []], "23": ["SVO", "I(S) / don't have(V) / any work(O) / lined up(M) / for next week(M) / yet(M)", "過去分詞 lined up が work を後ろから説明している。否定文の yet で「まだ」。", [["line up", "(予定・仕事など)を確保する、入れておく"]]], "24": ["SV", "This job(S) / 's taking(V) / longer(M) / than I expected(M)", "現在進行形。take longer で「(予想より)時間がかかる」。比較級 + than 節。", []], "25": ["SVO（主節）", "I(S) / think(V) / (that) I'll be done in about an hour(O)", "I think のあとに that 節（that は省略）。中の節は be done で SVC。", [["be done", "終わる、済む"]]], "26": ["SVO", "I(S) / haven't gotten(V) / the footage(O) / yet(M)", "現在完了の否定文 + yet で「まだ…していない」。gotten はアメリカ英語の過去分詞。", []], "27": ["SV", "I(S) / 'm waiting(V) / to hear back from the client(M)", "wait to do で「…するのを待つ」。", [["hear back from (人)", "(人)から返事をもらう"]]], "28": ["SVO", "I(S) / got(V) / a few revisions(O)", "get の過去形 got で「もらった、受けた」。a few は「いくつか」。", []], "29": ["SVC（主節）", "Once I fix this(M), / I(S) / 'm(V) / done(C)", "once は接続詞で「…したら、…するとすぐに」。", [["be done", "終わる、済む"]]], "30": ["SVC", "This footage(S) / doesn't look(V) / as good(C) / as I expected(M)", "not as ... as ～で「～ほど…ではない」。look + 形容詞で「…に見える」。", []], "31": ["SVO（主節）", "I(S) / wonder(V) / if this was shot in 4K( function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function gramHTML(i){
  const g=GRAMMAR[i]; if(!g) return '';
  const struct=esc(g[1]).replace(/\((S|V|O|C|M)\)/g,'<sub class="t-$1">$1</sub>').replace(/ \/ /g,'<span class="sep">/</span>');
  let h='<div class="gram-head"><span class="gram-label">文型</span><span class="gram-badge">'+esc(g[0])+'</span></div>';
  h+='<div class="gram-struct">'+struct+'</div><p class="gram-text">'+esc(g[2])+'</p>';
  if(g[3].length){ h+='<ul class="idioms">'+g[3].map(x=>'<li><b>'+esc(x[0])+'</b>'+esc(x[1])+'</li>').join('')+'</ul>'; }
  return h;
}

const SETS = [['all','すべて'],['daily','日常会話'],['travel','旅行英会話']];
const inSet = i => state.set==='all' || DATA[i][3]===state.set;
const catsOf = s => [...new Set(DATA.filter(d=>s==='all'||d[3]===s).map(d=>d[0]))];

const store = {
  get(k,def){try{const v=localStorage.getItem('shunkan:'+k);return v===null?def:JSON.parse(v)}catch(e){return def}},
  set(k,v){try{localStorage.setItem('shunkan:'+k,JSON.stringify(v))}catch(e){}}
};


// 重複削除に伴う記録の番号ずれを補正(1回だけ)
(function(){
  if(store.get('migDup',false)) return;
  const removed=[191, 197]; const m=store.get('marks',{}); const out={};
  Object.keys(m).forEach(k=>{ const i=+k; if(removed.includes(i)) return; out[i-removed.filter(r=>r<i).length]=m[k]; });
  store.set('marks',out); store.set('migDup',true);
})();
const state = {
  set: store.get('set','all'),
  cat: store.get('cat','all'),
  showReply: store.get('showReply',true),
  showGram: store.get('showGram',true),
  shuffle: store.get('shuffle',false),
  weakOnly: false,
  audioJa: store.get('audioJa',true),
  audioEn: store.get('audioEn',true),
  rate: store.get('rate',1),
  rateJa: store.get('rateJa',1.3),
  auto: store.get('auto',false),
  marks: store.get('marks',{}), // index -> 'ok' | 'again'
  order: [], pos: 0, revealed: false
};

const $ = id=>document.getElementById(id);

/* ---------- Voices ---------- */
const synth = window.speechSynthesis;
let voices = [];
const QUALITY = [/natural/i,/neural/i,/online/i,/premium/i,/enhanced/i,/siri/i,/google/i,/samantha|ava|allison|zoe|evan|nathan|aria|jenny|guy|kyoko|otoya|nanami|keita|o-ren/i];
function score(v){
  let s=0; QUALITY.forEach((re,i)=>{ if(re.test(v.name)) s+= (QUALITY.length-i)*2; });
  if(!v.localService) s+=1;
  if(/novelty|compact|eloquence|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|organ|jester|superstar|wobble|albert|fred|junior|ralph|grandma|grandpa|rocko|shelley|flo|reed|sandy/i.test(v.name)) s-=50;
  return s;
}
function pick(lang){
  const list = voices.filter(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith(lang));
  if(lang==='en'){
    list.sort((a,b)=>{
      const pa=/en-us/i.test(a.lang.replace('_','-'))?3:0, pb=/en-us/i.test(b.lang.replace('_','-'))?3:0;
      return (score(b)+pb)-(score(a)+pa);
    });
  } else list.sort((a,b)=>score(b)-score(a));
  return list;
}
function fillSelect(sel, list, savedKey){
  const saved = store.get(savedKey,null);
  sel.innerHTML='';
  if(!list.length){ const o=document.createElement('option'); o.textContent='この端末に対応する声がありません'; o.value=''; sel.appendChild(o); sel.disabled=true; return; }
  sel.disabled=false;
  list.forEach(v=>{ const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
  if(saved && list.some(v=>v.voiceURI===saved)) sel.value=saved; else sel.value=list[0].voiceURI;
}
function loadVoices(){
  if(!synth) return;
  voices = synth.getVoices();
  if(!voices.length) return;
  fillSelect($('vJa'), pick('ja'), 'voiceJa');
  const enList=pick('en'); fillSelect($('vEn'), enList, 'voiceEn');
  fillSelect($('vReply'), enList, 'voiceReply');
  if(!store.get('voiceReply',null) && enList.length>1){ const alt=enList.find(v=>v.voiceURI!==$('vEn').value); if(alt) $('vReply').value=alt.voiceURI; }
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; setTimeout(loadVoices,500); }

function speak(text, lang, onend){
  if(!synth){ onend&&onend(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const uri = lang==='ja'?$('vJa').value:lang==='reply'?$('vReply').value:$('vEn').value;
  const v = voices.find(x=>x.voiceURI===uri);
  if(v){u.voice=v;u.lang=v.lang}else{u.lang = lang==='ja'?'ja-JP':'en-US'}
  u.rate = lang==='ja'?state.rateJa:state.rate;
  if(onend){ u.onend=onend; }
  synth.speak(u);
}

/* ---------- Deck ---------- */
function buildOrder(){
  let idx = DATA.map((_,i)=>i).filter(i=> inSet(i) && (state.cat==='all' || DATA[i][0]===state.cat));
  if(state.weakOnly) idx = idx.filter(i=>state.marks[i]==='again');
  const rank={}; DATA.forEach((d,i)=>{ const k=d[3]+'|'+d[0]; if(!(k in rank)) rank[k]=i; });
  idx.sort((a,b)=> (rank[DATA[a][3]+'|'+DATA[a][0]]-rank[DATA[b][3]+'|'+DATA[b][0]]) || a-b);
  if(state.shuffle){ for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} }
  state.order=idx; state.pos=0;
}
function current(){ return state.order[state.pos]; }

let autoTimer=null;
function stopAuto(){ clearTimeout(autoTimer); autoTimer=null; $('cd').classList.remove('run'); }
function startCountdown(){
  stopAuto(); if(!state.auto || !state.order.length) return;
  const c=$('cd'); void c.offsetWidth; c.classList.add('run');
  autoTimer=setTimeout(()=>{ c.classList.remove('run'); if(state.auto && !state.revealed) reveal(); },5000);
}
function scheduleNext(){
  stopAuto(); if(!state.auto) return;
  autoTimer=setTimeout(()=>{ if(state.auto && state.revealed) next(); },2000);
}
function render(speakJa){
  stopAuto();
  const n=state.order.length;
  $('count').textContent = n? `${state.pos+1} / ${n}` : '0 / 0';
  $('prog').style.width = n? ((state.pos+1)/n*100)+'%' : '0';
  const card=$('card');
  if(!n){
    $('cat').textContent=''; $('jaText').textContent= state.weakOnly?'「言えなかった」文はまだありません。':'該当する文がありません。';
    $('enText').hidden=true; $('enHidden').hidden=true; $('reply').hidden=true; $('gram').hidden=true;
    $('actions').style.display='none'; $('grade').classList.remove('on');
    $('rpJa').disabled=true; $('rpEn').disabled=true;
    updateStat(); return;
  }
  $('actions').style.display='';
  $('rpJa').disabled=false;
  const [cat,ja,en]=DATA[current()];
  const m=state.marks[current()];
  $('cat').textContent = cat + (m==='ok'?'　前回：言えた':m==='again'?'　前回：言えなかった':'');
  $('jaText').textContent=ja;
  $('enText').textContent=en;
  state.revealed=false;
  $('enText').hidden=true; $('enHidden').hidden=false; $('reply').hidden=true; $('gram').hidden=true; $('gram').innerHTML=gramHTML(current());
  const rep=REPLIES[current()]; $('replyEn').textContent=rep?rep[0]:''; $('replyJa').textContent=rep?rep[1]:'';
  $('enBox').classList.remove('reveal');
  $('reveal').textContent='英語を表示';
  $('rpEn').disabled=true;
  $('grade').classList.remove('on');
  $('prev').disabled = state.pos===0;
  updateStat();
  if(speakJa && state.audioJa) speak(ja,'ja');
  if(state.auto) startCountdown();
}
function reveal(){
  if(!state.order.length) return;
  if(state.revealed){ next(); return; }
  state.revealed=true;
  $('enHidden').hidden=true; $('enText').hidden=false;
  const rep = state.showReply ? REPLIES[current()] : null;
  $('reply').hidden = !rep;
  $('gram').hidden = !(state.showGram && GRAMMAR[current()]);
  $('enBox').classList.add('reveal');
  $('reveal').textContent='次へ';
  $('rpEn').disabled=false;
  $('grade').classList.add('on');
  const en=DATA[current()][2];
  stopAuto();
  if(state.audioEn && synth){
    const idx=current(); let done=false;
    const after=()=>{ if(done||idx!==current()||!state.revealed) return; done=true; scheduleNext(); };
    if(rep){
      let enDone=false;
      const toReply=()=>{ if(enDone||idx!==current()||!state.revealed) return; enDone=true; setTimeout(()=>{ if(idx===current()&&state.revealed) speak(rep[0],'reply',after); },500); };
      speak(en,'en',toReply);
    } else speak(en,'en',after);
    setTimeout(after, rep?16000:9000); // 読み上げ終了を検知できない場合の保険
  } else scheduleNext();
}
function next(){
  if(state.pos < state.order.length-1){ state.pos++; render(true); }
  else { state.pos=0; if(state.shuffle) buildOrder(); render(true); }
}
function prev(){ if(state.pos>0){ state.pos--; render(true); } }
function mark(kind){
  const i=current(); if(i===undefined) return;
  state.marks[i]=kind; store.set('marks',state.marks);
  next();
}
function updateStat(){
  const ids = DATA.map((_,i)=>i).filter(i=> inSet(i) && (state.cat==='all' || DATA[i][0]===state.cat));
  const ok = ids.filter(i=>state.marks[i]==='ok').length;
  const ag = ids.filter(i=>state.marks[i]==='again').length;
  $('stat').textContent = `言えた ${ok}　言えなかった ${ag}`;
}

/* ---------- UI ---------- */
function makeSets(){
  const s=$('sets'); s.innerHTML='';
  SETS.forEach(([v,label])=>{
    const n=DATA.filter(d=>v==='all'||d[3]===v).length;
    const b=document.createElement('button'); b.className='set'; b.innerHTML=label+'<small>'+n+'</small>';
    b.setAttribute('aria-pressed', String(state.set===v));
    b.onclick=()=>{ state.set=v; store.set('set',v); state.cat='all'; store.set('cat','all'); makeSets(); makeFilters(); buildOrder(); render(true); };
    s.appendChild(b);
  });
}
function makeFilters(){
  const f=$('filters'); f.innerHTML='';
  const cats=catsOf(state.set);
  if(state.cat!=='all' && !cats.includes(state.cat)) state.cat='all';
  const all=[['all','すべて']].concat(cats.map(c=>[c,c]));
  all.forEach(([v,label])=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=label;
    b.setAttribute('aria-pressed', String(state.cat===v));
    b.onclick=()=>{ state.cat=v; store.set('cat',v); [...f.children].forEach(c=>c.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); buildOrder(); render(true); };
    f.appendChild(b);
  });
}
function setToggle(el,val){ el.setAttribute('aria-pressed',String(val)); }

$('tgJa').onclick=()=>{ state.audioJa=!state.audioJa; store.set('audioJa',state.audioJa); setToggle($('tgJa'),state.audioJa); if(!state.audioJa&&synth) synth.cancel(); };
$('tgEn').onclick=()=>{ state.audioEn=!state.audioEn; store.set('audioEn',state.audioEn); setToggle($('tgEn'),state.audioEn); if(!state.audioEn&&synth) synth.cancel(); };
$('reveal').onclick=reveal;
$('next').onclick=next;
$('prev').onclick=prev;
$('ok').onclick=()=>mark('ok');
$('again').onclick=()=>mark('again');
$('rpJa').onclick=()=>{ const i=current(); if(i!==undefined) speak(DATA[i][1],'ja'); };
$('rpEn').onclick=()=>{ const i=current(); if(i!==undefined && state.revealed) speak(DATA[i][2],'en'); };
$('shuffle').onclick=()=>{ state.shuffle=!state.shuffle; store.set('shuffle',state.shuffle); setToggle($('shuffle'),state.shuffle); buildOrder(); render(true); };
$('weak').onclick=()=>{ state.weakOnly=!state.weakOnly; setToggle($('weak'),state.weakOnly); buildOrder(); render(true); };
$('reset').onclick=()=>{ if(confirm('「言えた／言えなかった」の記録をすべて消しますか？')){ state.marks={}; store.set('marks',{}); buildOrder(); render(false); } };
$('vJa').onchange=e=>{ store.set('voiceJa',e.target.value); const i=current(); if(i!==undefined) speak(DATA[i][1],'ja'); };
$('vReply').onchange=e=>{ store.set('voiceReply',e.target.value); const r=REPLIES[current()]; if(r) speak(r[0],'reply'); };
$('rpReply').onclick=()=>{ const r=REPLIES[current()]; if(r&&state.revealed) speak(r[0],'reply'); };
$('tgGram').onclick=()=>{ state.showGram=!state.showGram; store.set('showGram',state.showGram); setToggle($('tgGram'),state.showGram); if(state.revealed) $('gram').hidden = !(state.showGram && GRAMMAR[current()]); };
$('tgReply').onclick=()=>{ state.showReply=!state.showReply; store.set('showReply',state.showReply); setToggle($('tgReply'),state.showReply); if(state.revealed) $('reply').hidden = !(state.showReply && REPLIES[current()]); };
$('vEn').onchange=e=>{ store.set('voiceEn',e.target.value); const i=current(); if(i!==undefined) speak(DATA[i][2],'en'); };
$('rateJa').value=state.rateJa;
$('rateJa').oninput=e=>{ state.rateJa=parseFloat(e.target.value); store.set('rateJa',state.rateJa); };
$('rateJa').onchange=()=>{ const i=current(); if(i!==undefined) speak(DATA[i][1],'ja'); };
$('rate').value=state.rate;
$('rate').oninput=e=>{ state.rate=parseFloat(e.target.value); store.set('rate',state.rate); };
$('rate').onchange=()=>{ const i=current(); if(i!==undefined) speak(DATA[i][2],'en'); };
$('tgAuto').onclick=()=>{ state.auto=!state.auto; store.set('auto',state.auto); setToggle($('tgAuto'),state.auto); if(state.auto){ if(!state.revealed) startCountdown(); else scheduleNext(); } else stopAuto(); };

document.addEventListener('keydown',e=>{
  if(e.target.closest('select,input,summary')) return;
  if(e.key===' '||e.key==='Enter'){ if(e.target.tagName==='BUTTON') return; e.preventDefault(); reveal(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key==='j'||e.key==='J'){ $('rpJa').click(); }
  else if(e.key==='e'||e.key==='E'){ $('rpEn').click(); }
});

setToggle($('tgJa'),state.audioJa); setToggle($('tgEn'),state.audioEn); setToggle($('shuffle'),state.shuffle); setToggle($('tgAuto'),state.auto); setToggle($('tgReply'),state.showReply); setToggle($('tgGram'),state.showGram);
if(!synth){ $('tgJa').disabled=true; $('tgEn').disabled=true; }
makeSets(); makeFilters(); buildOrder(); render(false);
</script>
</body>
</html>
